<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Shared Message App</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <main class="container">

        <h1>Shared Message App</h1>

        <div class="form-group">

            <label for="sender">
                Your Name
            </label>

            <input
                type="text"
                id="sender"
                placeholder="Enter your name"
                autocomplete="off"
            >

        </div>


        <div class="form-group">

            <label for="message">
                Message
            </label>

            <textarea
                id="message"
                rows="5"
                placeholder="Write your message..."
            ></textarea>

        </div>


        <div class="button-group">

            <button
                id="sendButton"
                type="button"
            >
                Send Message
            </button>


            <button
                id="fetchButton"
                type="button"
                class="green"
            >
                Fetch All Messages
            </button>

        </div>


        <div
            id="status"
            class="status"
        ></div>


        <section
            id="messagesSection"
            hidden
        >

            <h2>Messages</h2>

            <div id="messages"></div>

        </section>

    </main>


    <!--
        ?v=2 prevents the browser from using an old cached
        version of script.js.
    -->

    <script src="script.js?v=567"></script>

</body>

</html>
