<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shared Message Box</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="card">
  <h1>Shared Message Box</h1>

  <div class="warning">
    <strong>GitHub token required:</strong>
    This GitHub Pages version writes directly to the repository using
    the GitHub API. Each person who sends or fetches messages must provide
    a GitHub token with access to this repository. Never put a token directly
    into this website's source code.
  </div>

  <label for="sender">Sender name</label>
  <input id="sender" maxlength="80" placeholder="Enter your name">

  <label for="message">Message</label>
  <textarea id="message" maxlength="2000"
    placeholder="Write your message..."></textarea>

  <button id="sendBtn">Send Message</button>

  <hr>

  <button id="fetchBtn" class="green">Fetch All Messages</button>

  <p id="status"></p>

  <section id="messagesSection" hidden>
    <h2>Messages</h2>
    <div id="messages"></div>
  </section>
</main>

<script src="script.js"></script>
</body>
</html>
