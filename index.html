<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Paid Course Enquiry</title>
    <a
    href="https://meet.google.com/your-meeting-code"
    target="_blank"
    class="meet-button"
>
    🎥 Join Meet With Host
</a>
    <link
        rel="stylesheet"
        href="style.css?v=6"
    >

</head>


<body>

    <div class="app-container">


        <!-- ==================================================
             LEFT SIDE
        =================================================== -->

        <aside class="left-panel">

            <div class="logo-area">

                <div class="logo">
                    💬
                </div>

                <div>

                    <h1>
                        Enquiry Board
                    </h1>

                </div>

            </div>


            <!-- SEND Enquiry -->

            <div class="send-panel">

                <h2>
                    SEND Enquiry
                </h2>

                <p class="description">
                    Enter your name and message below.
                </p>


                <!-- NAME -->

                <label for="sender">
                    Your Name
                </label>

                <input
                    type="text"
                    id="sender"
                    placeholder="Enter your name"
                    autocomplete="off"
                >


                <!-- MESSAGE -->

                <label for="message">
                    Message
                </label>

                <textarea
                    id="message"
                    rows="7"
                    placeholder="Write your message..."
                ></textarea>


                <!-- SEND -->

                <button
                    id="sendButton"
                    type="button"
                    class="send-button"
                >

                    <span>
                        ➤
                    </span>

                    Send Enquiry

                </button>


                <!-- STATUS -->

                <div
                    id="status"
                    class="status"
                ></div>

            </div>


            <!-- REFRESH -->

            <div class="left-footer">

                <button
                    id="fetchButton"
                    type="button"
                    class="refresh-button"
                >

                    🔄 Fetch All Enquiry Official Use Only

                </button>


                <p>
                    Enquiry are automatically updated.
                </p>

            </div>

        </aside>


        <!-- ==================================================
             RIGHT SIDE
        =================================================== -->

        <main class="right-panel">


            <!-- HEADER -->

            <header class="messages-header">

                <div>

                    <h2>
                        All Messages
                    </h2>

                    <p>
                        Shared messages
                    </p>

                </div>


                <div class="live-indicator">

                    <span class="live-dot"></span>

                    <span>
                        Live
                    </span>

                </div>

            </header>


            <!-- MESSAGE AREA -->

            <section class="messages-area">

                <div
                    id="messages"
                    class="messages"
                >

                    <div class="empty-message">

                        <div class="empty-icon">
                            💬
                        </div>

                        <h3>
                            No messages loaded
                        </h3>

                        <p>
                            Click "Fetch All Messages" to load messages.
                        </p>

                    </div>

                </div>

            </section>


        </main>


    </div>


    <!-- ======================================================
         IMPORTANT

         v=4 prevents browser cache from loading an old
         script.js.
    ======================================================= -->

    <script src="script.js?v=11"></script>

</body>

</html>
